<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lotusBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E0A12"/>
      <stop offset="50%" stop-color="#3A121D"/>
      <stop offset="100%" stop-color="#5C1B2A"/>
    </linearGradient>

    <radialGradient id="waterGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#F2D17E" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#C9A24A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1E0A12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#lotusBg)"/>
  <ellipse cx="720" cy="750" rx="600" ry="250" fill="url(#waterGlow)"/>

  <!-- Water Ripple Rings -->
  <g stroke="#E5C77A" stroke-width="1" fill="none" opacity="0.2">
    <ellipse cx="720" cy="750" rx="180" ry="40"/>
    <ellipse cx="720" cy="750" rx="340" ry="70"/>
    <ellipse cx="720" cy="750" rx="520" ry="110"/>
    <ellipse cx="360" cy="680" rx="140" ry="30"/>
    <ellipse cx="1080" cy="680" rx="140" ry="30"/>
  </g>

  <!-- Large Floating Golden Sacred Lotuses -->
  <g transform="translate(720, 680)">
    <!-- Central Lotus Flower -->
    <path d="M0 -70 C25 -30, 25 15, 0 35 C-25 15, -25 -30, 0 -70 Z" fill="#F7C06D" opacity="0.8"/>
    <path d="M0 -70 C40 -20, 45 20, 0 35 C-45 20, -40 -20, 0 -70 Z" fill="#E5C77A" opacity="0.6"/>
    <path d="M-15 -55 C-55 -15, -45 25, 0 35 C-20 20, -35 -20, -15 -55 Z" fill="#C9A24A" opacity="0.75"/>
    <path d="M15 -55 C55 -15, 45 25, 0 35 C20 20, 35 -20, 15 -55 Z" fill="#C9A24A" opacity="0.75"/>
    <circle cx="0" cy="5" r="8" fill="#FFF3CE" opacity="0.9"/>
  </g>

  <!-- Flanking Lotus Buds -->
  <g transform="translate(360, 650) scale(0.65)">
    <path d="M0 -60 C20 -25, 20 15, 0 30 C-20 15, -20 -25, 0 -60 Z" fill="#F7C06D" opacity="0.65"/>
    <path d="M-12 -45 C-40 -10, -35 20, 0 30 Z" fill="#C9A24A" opacity="0.6"/>
    <path d="M12 -45 C40 -10, 35 20, 0 30 Z" fill="#C9A24A" opacity="0.6"/>
  </g>

  <g transform="translate(1080, 650) scale(0.65)">
    <path d="M0 -60 C20 -25, 20 15, 0 30 C-20 15, -20 -25, 0 -60 Z" fill="#F7C06D" opacity="0.65"/>
    <path d="M-12 -45 C-40 -10, -35 20, 0 30 Z" fill="#C9A24A" opacity="0.6"/>
    <path d="M12 -45 C40 -10, 35 20, 0 30 Z" fill="#C9A24A" opacity="0.6"/>
  </g>
</svg>