<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Romantic Sunrise Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1119"/>
      <stop offset="35%" stop-color="#541B29"/>
      <stop offset="65%" stop-color="#933A38"/>
      <stop offset="85%" stop-color="#D97A48"/>
      <stop offset="95%" stop-color="#F2AF64"/>
      <stop offset="100%" stop-color="#FFF3CE"/>
    </linearGradient>

    <!-- Sun Glow Radial -->
    <radialGradient id="sunGlow" cx="50%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#FFF7DC" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#F7C06D" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#D46A42" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#8F2A38" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2D1119" stop-opacity="0"/>
    </radialGradient>

    <!-- Mist Gradient -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F7C06D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#933A38" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B242D"/>
      <stop offset="40%" stop-color="#42141D"/>
      <stop offset="100%" stop-color="#210A0F"/>
    </linearGradient>

    <!-- Gold Accent Linear -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#E5C77A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="1440" height="900" fill="url(#skyGrad)"/>

  <!-- Golden Morning Sun Radiance -->
  <circle cx="720" cy="540" r="380" fill="url(#sunGlow)"/>

  <!-- Distant Mountains / Horizon Silhouette -->
  <path d="M0 620 Q 320 590 600 610 T 1100 595 Q 1300 615 1440 625 L 1440 700 L 0 700 Z" fill="#3D141C" opacity="0.6"/>

  <!-- Morning Mist Layer -->
  <rect x="0" y="520" width="1440" height="150" fill="url(#mistGrad)"/>

  <!-- The 5 Iconic Towers of Angkor Wat Silhouette -->
  <g fill="#240A10">
    <!-- Outer Galleried Enclosure Base -->
    <rect x="180" y="615" width="1080" height="45" rx="3"/>
    <polygon points="170,660 1270,660 1250,625 190,625"/>
    <rect x="220" y="595" width="1000" height="20" rx="2"/>

    <!-- Left Outer Tower (Tower 5) -->
    <g transform="translate(380, 430)">
      <rect x="20" y="130" width="60" height="40"/>
      <polygon points="15,130 85,130 80,105 20,105"/>
      <polygon points="20,105 80,105 75,80 25,80"/>
      <polygon points="25,80 75,80 70,55 30,55"/>
      <polygon points="30,55 70,55 65,30 35,30"/>
      <path d="M35 30 C 40 10, 60 10, 65 30 Z"/>
      <!-- Stupa spire -->
      <polygon points="48,30 52,30 51,0 49,0"/>
      <circle cx="50" cy="2" r="3" fill="#E5C77A" opacity="0.5"/>
    </g>

    <!-- Left Inner Tower (Tower 2) -->
    <g transform="translate(510, 360)">
      <rect x="20" y="190" width="80" height="50"/>
      <polygon points="15,190 105,190 98,155 22,155"/>
      <polygon points="22,155 98,155 92,120 28,120"/>
      <polygon points="28,120 92,120 85,85 35,85"/>
      <polygon points="35,85 85,85 78,50 42,50"/>
      <path d="M42 50 C 48 20, 72 20, 78 50 Z"/>
      <!-- Stupa spire -->
      <polygon points="58,50 62,50 61,10 59,10"/>
      <circle cx="60" cy="12" r="3.5" fill="#E5C77A" opacity="0.6"/>
    </g>

    <!-- Central Grand Sanctuary Tower (Bakan - Tower 1) -->
    <g transform="translate(660, 270)">
      <rect x="15" y="270" width="90" height="60"/>
      <polygon points="10,270 110,270 102,225 18,225"/>
      <polygon points="18,225 102,225 95,180 25,180"/>
      <polygon points="25,180 95,180 88,135 32,135"/>
      <polygon points="32,135 88,135 80,90 40,90"/>
      <polygon points="40,90 80,90 74,55 46,55"/>
      <path d="M46 55 C 52 20, 68 20, 74 55 Z"/>
      <!-- High Stupa finial pointing to heavens -->
      <polygon points="58,55 62,55 61,5 59,5"/>
      <circle cx="60" cy="8" r="4" fill="#FFF3CE" opacity="0.8"/>
      <!-- Fleur-de-lis / Lotus crown spark -->
      <circle cx="60" cy="8" r="14" fill="#E5C77A" opacity="0.2"/>
    </g>

    <!-- Right Inner Tower (Tower 3) -->
    <g transform="translate(810, 360)">
      <rect x="20" y="190" width="80" height="50"/>
      <polygon points="15,190 105,190 98,155 22,155"/>
      <polygon points="22,155 98,155 92,120 28,120"/>
      <polygon points="28,120 92,120 85,85 35,85"/>
      <polygon points="35,85 85,85 78,50 42,50"/>
      <path d="M42 50 C 48 20, 72 20, 78 50 Z"/>
      <!-- Stupa spire -->
      <polygon points="58,50 62,50 61,10 59,10"/>
      <circle cx="60" cy="12" r="3.5" fill="#E5C77A" opacity="0.6"/>
    </g>

    <!-- Right Outer Tower (Tower 4) -->
    <g transform="translate(960, 430)">
      <rect x="20" y="130" width="60" height="40"/>
      <polygon points="15,130 85,130 80,105 20,105"/>
      <polygon points="20,105 80,105 75,80 25,80"/>
      <polygon points="25,80 75,80 70,55 30,55"/>
      <polygon points="30,55 70,55 65,30 35,30"/>
      <path d="M35 30 C 40 10, 60 10, 65 30 Z"/>
      <!-- Stupa spire -->
      <polygon points="48,30 52,30 51,0 49,0"/>
      <circle cx="50" cy="2" r="3" fill="#E5C77A" opacity="0.5"/>
    </g>
  </g>

  <!-- Cambodian Sugar Palm Silhouettes (ដើមត្នោត) on Left & Right Flanks -->
  <g fill="#180509">
    <!-- Left Palm 1 -->
    <path d="M120 660 Q 135 520 150 380 Q 146 520 130 660 Z"/>
    <g transform="translate(150, 380)">
      <ellipse cx="0" cy="-5" rx="35" ry="35" opacity="0.95"/>
      <circle cx="-15" cy="-15" r="22"/>
      <circle cx="15" cy="-15" r="22"/>
      <circle cx="-25" cy="5" r="18"/>
      <circle cx="25" cy="5" r="18"/>
      <circle cx="0" cy="-28" r="20"/>
    </g>

    <!-- Left Palm 2 (Taller) -->
    <path d="M70 660 Q 80 480 95 320 Q 91 480 78 660 Z"/>
    <g transform="translate(95, 320)">
      <ellipse cx="0" cy="-5" rx="42" ry="42" opacity="0.95"/>
      <circle cx="-18" cy="-18" r="26"/>
      <circle cx="18" cy="-18" r="26"/>
      <circle cx="-30" cy="8" r="22"/>
      <circle cx="30" cy="8" r="22"/>
      <circle cx="0" cy="-32" r="24"/>
    </g>

    <!-- Right Palm 1 -->
    <path d="M1320 660 Q 1305 520 1290 380 Q 1294 520 1310 660 Z"/>
    <g transform="translate(1290, 380)">
      <ellipse cx="0" cy="-5" rx="35" ry="35" opacity="0.95"/>
      <circle cx="-15" cy="-15" r="22"/>
      <circle cx="15" cy="-15" r="22"/>
      <circle cx="-25" cy="5" r="18"/>
      <circle cx="25" cy="5" r="18"/>
      <circle cx="0" cy="-28" r="20"/>
    </g>

    <!-- Right Palm 2 (Taller) -->
    <path d="M1370 660 Q 1360 480 1345 320 Q 1349 480 1362 660 Z"/>
    <g transform="translate(1345, 320)">
      <ellipse cx="0" cy="-5" rx="42" ry="42" opacity="0.95"/>
      <circle cx="-18" cy="-18" r="26"/>
      <circle cx="18" cy="-18" r="26"/>
      <circle cx="-30" cy="8" r="22"/>
      <circle cx="30" cy="8" r="22"/>
      <circle cx="0" cy="-32" r="24"/>
    </g>
  </g>

  <!-- Reflection Water Pool (Lotus Pond) -->
  <rect x="0" y="660" width="1440" height="240" fill="url(#waterGrad)"/>

  <!-- Shimmering Golden Water Reflection of Towers -->
  <g fill="#E5C77A" opacity="0.18">
    <ellipse cx="720" cy="710" rx="60" ry="8"/>
    <ellipse cx="720" cy="735" rx="90" ry="6"/>
    <ellipse cx="720" cy="760" rx="120" ry="5"/>
    <ellipse cx="720" cy="790" rx="140" ry="4"/>
    <ellipse cx="720" cy="820" rx="160" ry="3"/>
    <ellipse cx="570" cy="725" rx="40" ry="5"/>
    <ellipse cx="570" cy="750" rx="55" ry="4"/>
    <ellipse cx="870" cy="725" rx="40" ry="5"/>
    <ellipse cx="870" cy="750" rx="55" ry="4"/>
    <ellipse cx="430" cy="740" rx="30" ry="4"/>
    <ellipse cx="1010" cy="740" rx="30" ry="4"/>
  </g>

  <!-- Floating Golden Lotus Flowers on Water -->
  <g fill="#F7C06D" opacity="0.6">
    <ellipse cx="480" cy="820" rx="16" ry="6"/>
    <circle cx="480" cy="816" r="4" fill="#FFF3CE"/>
    <ellipse cx="940" cy="840" rx="20" ry="7"/>
    <circle cx="940" cy="835" r="5" fill="#FFF3CE"/>
    <ellipse cx="320" cy="780" rx="14" ry="5"/>
    <ellipse cx="1120" cy="790" rx="15" ry="5"/>
  </g>

  <!-- Golden Atmospheric Vignette Overlay -->
  <rect width="1440" height="900" fill="url(#goldAccent)" pointer-events="none"/>
</svg>